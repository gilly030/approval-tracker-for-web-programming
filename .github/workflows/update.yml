name: 갤럽 리포트 자동 반영

on:
  schedule:
    # 3시간마다 (한국시간 0:23, 3:23, … 21:23). GitHub이 예약 실행을 가끔 건너뛰어서 넉넉하게.
    # 갤럽은 보통 금요일 오후에 새 리포트를 올린다.
    - cron: "23 */3 * * *"
  push:
    # 관리자 페이지에서 받은 data.json을 올렸을 때도 사이트용 파일을 다시 만든다
    paths: ["data/data.json"]
  workflow_dispatch:
    inputs:
      max:
        description: "과거 채우기 때 한 번에 받을 리포트 수"
        default: "50"

permissions:
  contents: write
  pages: write
  actions: write   # 과거 채우기를 이어서 실행하려고

concurrency:
  group: gallup-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: pdf.js 설치
        run: npm install --no-audit --no-fund

      - name: 새 리포트 확인·반영
        id: update
        if: github.event_name != 'push'
        run: node tools/update.mjs --max "${{ github.event.inputs.max || '50' }}"

      - name: 사이트용 파일 만들기 (index.json, years/)
        if: always()
        run: node tools/build-data.mjs

      - name: 바뀐 데이터 커밋
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "바뀐 데이터 없음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages 다시 배포
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 재배포 요청 실패 (다음 푸시 때 반영됨)"

      # 접속이 잘 되는 동안에는 10분 쉬고 다음 과거 채우기를 이어서 건다 (실패하면 멈추고 예약 실행만 따름)
      - name: 과거 채우기 이어서 실행
        if: steps.update.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          gh workflow run update.yml --repo "${{ github.repository }}" --ref "${GITHUB_REF_NAME}" -f max=50
